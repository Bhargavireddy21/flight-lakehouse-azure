[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks use `spark`, `dbutils` and `display` as globals and import after setup cells.
"notebooks/*" = ["F821", "E402", "E501"]
"scripts/*" = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
