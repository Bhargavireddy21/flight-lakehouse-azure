name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (local Spark)
        run: pytest -q

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Validate Data Factory JSON
        run: |
          for f in adf/*/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "invalid: $f"; exit 1; }; done
